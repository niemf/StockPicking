<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ page_title }} · TradeAI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  {# Served locally: CDN availability is unreliable on the target network. #}
  <script src="{{ url_for('static', path='vendor/echarts.min.js') }}"></script>
  <script src="{{ url_for('static', path='vendor/htmx.min.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">T</span>
      <span class="brand-text">
        <strong>TradeAI</strong>
        <small>A 股监控 · AI 复盘</small>
      </span>
    </a>

    <nav class="nav">
      <a href="/" class="{% if page == 'dashboard' %}active{% endif %}">仪表盘</a>
      <a href="/watchlist" class="{% if page == 'watchlist' %}active{% endif %}">自选股</a>
      {% if feature_holdings %}<a href="/holdings" class="{% if page == 'holdings' %}active{% endif %}">持仓</a>{% endif %}
      <a href="/sectors" class="{% if page == 'sectors' %}active{% endif %}">板块</a>
      <a href="/limit-board" class="{% if page == 'limit' %}active{% endif %}">涨停</a>
      <a href="/candidates" class="{% if page == 'candidates' %}active{% endif %}">候选池</a>
      <a href="/plans" class="{% if page == 'plans' %}active{% endif %}">计划</a>
      <a href="/alerts" class="{% if page == 'alerts' %}active{% endif %}">预警</a>
      <a href="/reports" class="{% if page == 'reports' %}active{% endif %}">复盘</a>
    </nav>

    <div class="topbar-meta">
      <span class="market-state" id="market-state">
        <span class="market-dot"></span>
        <span id="market-state-text">读取中</span>
      </span>
      <span class="today" id="today-text"></span>
    </div>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>TradeAI · 个人研究工具</span>
    <span>行情来源：腾讯 / 新浪 · 日线与财务：AkShare</span>
    <span>本工具不构成任何投资建议</span>
  </footer>

  <script src="{{ url_for('static', path='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
